name = "devsarim/vide"
version = "0.4.5"
description = "A reactive Luau library for creating UI."
authors = ["devsarim"]
repository = "https://github.com/devsarim/vide"
license = "MIT"
includes = ["src/*", "README.md", "pesde.toml"]

[target]
environment = "roblox"
build_files = ["src"]
lib = "src/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"
